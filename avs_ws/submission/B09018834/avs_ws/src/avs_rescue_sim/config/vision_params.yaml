vision_node:
  ros__parameters:
    use_sim_time: true
    image_topic: /camera/image_raw
    camera_info_topic: /camera/camera_info
    map_frame: map
    process_every_n: 2
    min_hazard_area: 900
    tag_size: 0.1875
    marker_smoothing_alpha: 0.35
    hazard_names: [FIRE, CHEMICAL, RADIATION, ELECTRICAL, BIOHAZARD]
    # YOLOv5 handles distant/perspective corridor signs. If trained weights or
    # PyTorch are unavailable, the tested SIFT implementation remains usable.
    hazard_backend: yolov5
    yolov5_weights: '' # Empty resolves to the installed package model below.
    # 320 is sufficient for the 640x480 camera and averages ~22 ms/frame on
    # the acceptance machine. The low area floor preserves distant detections.
    yolov5_image_size: 320
    yolov5_confidence: 0.45
    yolov5_iou_threshold: 0.45
    yolov5_min_area: 80
    # Verified artwork proposes a magnified crop; YOLO must classify it again.
    yolov5_region_recovery: true
    # Colour proposes a panel; its registered white pictogram validates it.
    # Outline fitting uses the camera's panel edges rather than raw YOLO sizes.
    panel_symbol_score: 0.34
    hazard_box_smoothing_alpha: 0.65
    hazard_max_center_step: 0.18 # Fraction of image width allowed per processed frame.
    hazard_display_frames: 1 # Show current verified detections; events still need 3 frames.
    allow_sift_fallback: true
    tag_labels: [COLLAPSE, TOXIC_LEAK, TRAPPED_PERSON, HIGH_TEMPERATURE]
    min_pattern_inliers: 7
    confirmation_frames: 3
    core_bounds: [1.15, 0.05, 2.95, 1.85]
    tag_confirmation_frames: 4
    max_reprojection_error: 2.5
    # Only the course's solid red push box; printed signs are excluded.
    barrier_min_area: 700
    barrier_min_fill: 0.82
    barrier_max_white_fraction: 0.08
