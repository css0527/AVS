bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0 # Stop commands while TF recovers; do not abort on a short scheduling delay.
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker", "position_goal_checker", "turn_goal_checker"]
    controller_plugins: ["FollowPath", "PrecisionPath", "ReleasePusher"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.08
      movement_time_allowance: 20.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.025
      yaw_goal_tolerance: 0.045
    position_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      # Translation finishes independently of final heading. The mission then
      # aligns at the CURRENT pose with turn_goal_checker, so AMCL corrections
      # cannot repeatedly switch RPP between position correction and rotation.
      xy_goal_tolerance: 0.025
      yaw_goal_tolerance: 3.15
    # Forward-only tracking. Camera panning handles wall observations; base
    # rotations are reserved for path corners and the final goal heading.
    turn_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.045
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.30
      lookahead_dist: 0.30
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.40
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 0.55
      rotate_to_heading_min_angle: 0.50
      max_angular_accel: 0.8
      use_rotate_to_heading: true
      allow_reversing: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.40
      regulated_linear_scaling_min_speed: 0.025
      use_cost_regulated_linear_velocity_scaling: false
      min_approach_linear_velocity: 0.025
      approach_velocity_scaling_dist: 0.30
      transform_tolerance: 0.20
    # Keep the proven low-speed profile for doorway crossing and push alignment.
    # Its collision checks and goal tolerances remain as strict as normal travel.
    PrecisionPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.12
      lookahead_dist: 0.30
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.40
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 0.35
      rotate_to_heading_min_angle: 0.50
      max_angular_accel: 0.8
      use_rotate_to_heading: true
      allow_reversing: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.40
      regulated_linear_scaling_min_speed: 0.025
      use_cost_regulated_linear_velocity_scaling: false
      min_approach_linear_velocity: 0.025
      approach_velocity_scaling_dist: 0.40
      transform_tolerance: 0.20
    ReleasePusher:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.12
      lookahead_dist: 0.30
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.40
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 0.35
      rotate_to_heading_min_angle: 0.50
      max_angular_accel: 0.8
      use_rotate_to_heading: true
      allow_reversing: false
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.40
      regulated_linear_scaling_min_speed: 0.025
      use_cost_regulated_linear_velocity_scaling: false
      min_approach_linear_velocity: 0.025
      approach_velocity_scaling_dist: 0.40
      transform_tolerance: 0.20

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.02
      # Convex hull of the SDF chassis, wheels and V-pusher collision boxes.
      # The physical pusher is 0.28 m wide; wheel edges define a 0.285 m
      # maximum width, retaining real clearance through the 0.50 m door.
      footprint: "[[0.353, 0.0606], [0.29, 0.14], [0.085, 0.1425], [-0.085, 0.1425], [-0.21, 0.12], [-0.21, -0.12], [-0.085, -0.1425], [0.085, -0.1425], [0.29, -0.14], [0.353, -0.0606]]"
      footprint_padding: 0.01
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Faster cost decay leaves more usable space in narrow passages.
        # Keep the real pusher footprint and its 1 cm padding for collisions.
        cost_scaling_factor: 8.0
        inflation_radius: 0.22
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.5
          obstacle_min_range: 0.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      footprint: "[[0.353, 0.0606], [0.29, 0.14], [0.085, 0.1425], [-0.085, 0.1425], [-0.21, 0.12], [-0.21, -0.12], [-0.085, -0.1425], [0.085, -0.1425], [0.29, -0.14], [0.353, -0.0606]]"
      footprint_padding: 0.01
      resolution: 0.02
      track_unknown_space: false
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.5
          obstacle_min_range: 0.0
      static_layer:
        map_topic: /navigation_map
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0
        inflation_radius: 0.22
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    # Smac2D extracts its path directly from grid A* search.  NavFn's
    # potential-gradient extraction intermittently failed at the narrow room
    # exit despite finding a legal potential. Keep the GridBased ID requested
    # by our behavior trees and preserve the physical footprint/costmap.
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.10
      allow_unknown: False
      downsample_costmap: False
      max_iterations: 100000
      max_planning_time: 2.0

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.65
    min_rotational_vel: 0.15
    rotational_acc_lim: 0.8

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.30, 0.0, 0.75]
    min_velocity: [0.0, 0.0, -0.75]
    max_accel: [0.5, 0.0, 0.8]
    max_decel: [-0.5, 0.0, -0.8]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
